<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pauta Financeira — Notícias e educação financeira</title>
<meta name="description" content="Portal de notícias e educação financeira com calculadoras gratuitas e indicadores do mercado.">
<meta property="og:title" content="Pauta Financeira"><meta property="og:type" content="website">
<meta property="og:description" content="Notícias, educação financeira e calculadoras gratuitas.">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"NewsMediaOrganization","name":"Pauta Financeira","url":"https://pautafinanceira.com.br"}</script>
<style>
:root{--navy:#0b1f3a;--blue:#173a6b;--green:#1f8a5b;--bg:#faf9f6;--card:#fff;--tx:#17202e;--mut:#5a6577;--line:#e4e1d8}
@media(prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#152033;--tx:#e8ecf2;--mut:#9aa7ba;--line:#26344d;--navy:#070d17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3,.logo{font-family:Georgia,'Times New Roman',serif;line-height:1.2}a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{background:var(--navy);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-size:24px;font-weight:700;text-decoration:none;letter-spacing:.5px}.logo b{color:#4fd1a0}
nav{display:flex;gap:4px 16px;overflow-x:auto;padding-bottom:10px;white-space:nowrap;font-size:14px}
nav a{text-decoration:none;opacity:.85;padding:4px 0}nav a:hover{opacity:1;border-bottom:2px solid #4fd1a0}
.ind{display:flex;gap:10px;overflow-x:auto;padding:12px 0}
.ind div{min-width:128px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.ind strong{display:block;font-size:16px}.up{color:var(--green)}.dn{color:#c0392b}.mut{color:var(--mut);font-size:12px}
main{padding:24px 0 40px;min-height:60vh}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--mut);font-size:14px}
a.card{text-decoration:none;display:block}a.card:hover{border-color:var(--green)}
.hero{background:var(--navy);color:#fff;border-radius:12px;padding:28px 20px;margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:28px}.hero p{margin:0;opacity:.85}
.ad{border:1px dashed var(--line);color:var(--mut);text-align:center;padding:22px;font-size:12px;border-radius:8px;margin:20px 0}
label{display:block;font-size:14px;margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--card);color:var(--tx)}
button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:16px;cursor:pointer;margin:14px 8px 0 0}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--line)}
.res{margin-top:18px;padding:14px;border-left:4px solid var(--green);background:var(--card);border-radius:6px}
.big{font-size:26px;font-weight:700;font-family:Georgia,serif}
.note{font-size:13px;color:var(--mut);margin-top:10px}
h2.sec{border-bottom:2px solid var(--green);padding-bottom:4px;margin:28px 0 14px;font-size:20px}
footer{background:var(--navy);color:#cbd5e3;padding:24px 0;font-size:13px}footer a{margin-right:12px}
.err{color:#c0392b;font-size:14px}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top"><a class="logo" href="#/">PAUTA <b>FINANCEIRA</b></a></div>
<nav id="nav"></nav>
</div></header>
<div class="wrap"><div class="ind" id="ind" aria-live="polite"></div></div>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">
<p id="foot"></p>
<p>© <span id="yr"></span> Pauta Financeira. Conteúdo informativo e educacional; não constitui recomendação de investimento, crédito ou consultoria financeira.</p>
</div></footer>

<script>
/* ===== CONFIGURAÇÃO ===== */
const BRAPI_TOKEN = "";      // token gratuito em brapi.dev (necessário só para o Ibovespa)
const NEWSLETTER_URL = "";   // endpoint de formulário gratuito (ex.: Formspree, Buttondown)
/* ===== CONTEÚDO =====
   Adicione matérias REAIS aqui. Formato:
   {slug:"meu-titulo",cat:"economia",titulo:"",subtitulo:"",autor:"",data:"2026-11-17T09:00",capa:"",
    corpo:[{h:"Subtítulo",p:"Parágrafo"}],fontes:["Fonte 1"]} */
const ARTIGOS = [];
const CATS = [["ultimas","Últimas notícias"],["economia","Economia"],["mercado","Mercado financeiro"],["investimentos","Investimentos"],["financas-pessoais","Finanças pessoais"],["cartoes","Cartões de crédito"],["emprestimos","Empréstimos e financiamentos"],["dividas","Dívidas e nome limpo"],["bancos","Bancos e contas digitais"],["tecnologia","Tecnologia e negócios"]];
const PAGS = {
 sobre:["Sobre nós","A Pauta Financeira é um portal de informação e educação financeira para o público brasileiro. Nosso objetivo é explicar dinheiro, crédito e investimentos com clareza."],
 contato:["Contato","Defina aqui o e-mail oficial de contato da redação (ex.: contato@pautafinanceira.com.br, após registrar o domínio)."],
 privacidade:["Política de privacidade","Modelo-base para revisão: descreva quais dados são coletados (e-mail da newsletter, cookies de anúncios e métricas), a finalidade, o compartilhamento e os direitos do titular conforme a LGPD. Revise com assessoria jurídica antes de publicar."],
 cookies:["Política de cookies","Modelo-base: o site pode usar cookies de preferência, de análise e de publicidade. Ao ativar AdSense ou analytics, inclua um aviso de consentimento e liste cada categoria."],
 termos:["Termos de uso","Modelo-base: o conteúdo é informativo; o uso das calculadoras é por conta do usuário; direitos autorais pertencem ao portal. Revise com assessoria jurídica."],
 editorial:["Política editorial","Compromissos: apuração com fontes identificadas, correção pública de erros, separação entre conteúdo editorial, patrocinado e links de afiliados."],
 aviso:["Aviso de responsabilidade financeira","Nada neste portal é recomendação de compra, venda ou contratação. Rentabilidade passada não garante resultados futuros. Consulte um profissional habilitado."]
};
const $=s=>document.querySelector(s);
const brl=n=>isFinite(n)?n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):"—";
const pct=n=>n.toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== TRIBUTOS (confira anualmente) ===== */
function inss(b){const f=[[1621.00,.075],[2902.84,.09],[4354.27,.12],[8475.55,.14]];let p=0,t=0;for(const[l,a]of f){if(b>p)t+=(Math.min(b,l)-p)*a;p=l}return t}
function irrf(b,i,dep){
 if(b<=5000)return 0;
 const f=(x)=>x<=2428.80?0:x<=2826.65?x*.075-182.16:x<=3751.05?x*.15-394.16:x<=4664.68?x*.225-675.49:x*.275-908.73;
 let base=Math.min(b-i-dep*189.59,b-607.20);let t=Math.max(0,f(base));
 if(b<=7350)t=Math.max(0,t-(978.62-0.133145*b));
 return t}
function liquido(b,dep){const i=inss(b),r=irrf(b,i,dep);return{i,r,l:b-i-r}}
function irCdb(d){return d<=180?.225:d<=360?.2:d<=720?.175:.15}

/* ===== CALCULADORAS ===== */
const R=(big,txt,extra="")=>`<div class="res"><div class="big">${big}</div><p>${txt}</p>${extra}</div>`;
const CALCS=[
{id:"juros-compostos",nome:"Juros compostos e investimento mensal",desc:"Evolução de um patrimônio com aportes mensais.",
 campos:[["ini","Valor inicial (R$)",1000],["apo","Aporte mensal (R$)",300],["tx","Taxa de juros anual (%)",10],["an","Prazo (anos)",10]],
 fn(v){const m=Math.pow(1+v.tx/100,1/12)-1,n=Math.round(v.an*12);let s=v.ini,ser=[s];for(let k=0;k<n;k++){s=s*(1+m)+v.apo;ser.push(s)}
  const inv=v.ini+v.apo*n;return R(brl(s),`Total investido: ${brl(inv)}. Juros acumulados: ${brl(s-inv)}.`,chart(ser)+`<p class="note">Hipóteses: taxa mensal equivalente, aporte no fim de cada mês, sem impostos nem taxas.</p>`)}},
{id:"cdb-cdi",nome:"CDB e rendimento do CDI",desc:"Rendimento bruto e líquido com IR regressivo.",
 campos:[["val","Valor aplicado (R$)",10000],["mes","Prazo (meses)",12],["cdi","CDI anual (%)",14.9],["pc","% do CDI",100]],
 fn(v){const tx=v.cdi*v.pc/100,b=v.val*Math.pow(1+tx/100,v.mes/12)-v.val,ir=b*irCdb(v.mes*30);
  return R(brl(v.val+b-ir),`Rendimento bruto ${brl(b)}; IR (${pct(irCdb(v.mes*30)*100)}) ${brl(ir)}; rendimento líquido ${brl(b-ir)}.`,`<p class="note">Hipóteses: 12 meses = 1 ano, IR regressivo (22,5% a 15%), sem IOF. Informe o CDI atual (veja a barra de indicadores).</p>`)}},
{id:"poupanca",nome:"Poupança",desc:"Simulação com a regra atual de rendimento.",
 campos:[["val","Valor inicial (R$)",5000],["apo","Aporte mensal (R$)",200],["mes","Prazo (meses)",24],["selic","Selic anual (%)",15]],
 fn(v){const m=v.selic>8.5?.005:.7*v.selic/100/12;let s=v.val;for(let k=0;k<v.mes;k++)s=s*(1+m)+v.apo;
  return R(brl(s),`Rendimento mensal usado: ${pct(m*100)}.`,`<p class="note">Regra: Selic acima de 8,5% a.a. rende 0,5% ao mês + TR (considerada zero aqui); abaixo disso, 70% da Selic. Isenta de IR para pessoa física.</p>`)}},
{id:"financiamento",nome:"Financiamento e empréstimo",desc:"Parcelas pela Tabela Price ou SAC.",
 campos:[["val","Valor financiado (R$)",200000],["tx","Taxa de juros mensal (%)",1],["n","Prazo (meses)",240],["sis","Sistema","price|price:Price (parcela fixa);sac:SAC (parcela decrescente)"]],
 fn(v){const i=v.tx/100,n=v.n;let tot,p1,pn;
  if(v.sis==="price"){p1=pn=i?v.val*i/(1-Math.pow(1+i,-n)):v.val/n;tot=p1*n}
  else{const a=v.val/n;p1=a+v.val*i;pn=a+a*i;tot=(p1+pn)*n/2}
  return R(brl(p1),`Primeira parcela. Última: ${brl(pn)}. Total pago: ${brl(tot)}. Juros totais: ${brl(tot-v.val)}.`,`<p class="note">Não inclui seguros, tarifas, IOF nem correção por TR/IPCA.</p>`)}},
{id:"cartao-dividas",nome:"Cartão rotativo e quitação de dívidas",desc:"Em quanto tempo você quita e quanto paga de juros.",
 campos:[["sal","Saldo devedor (R$)",3000],["tx","Juros mensais (%)",12],["pg","Pagamento mensal (R$)",400]],
 fn(v){let s=v.sal,j=0,m=0;const i=v.tx/100;if(v.pg<=s*i)return R("Dívida não quita",`O pagamento não cobre nem os juros do mês (${brl(s*i)}). Aumente o valor pago ou negocie a taxa.`);
  while(s>0.005&&m<1200){const jm=s*i;j+=jm;s=s+jm-v.pg;m++;if(s<0)s=0}
  return R(`${m} meses`,`Juros totais: ${brl(j)}. Total pago: ${brl(v.sal+j)}.`,`<p class="note">Hipótese: taxa constante e sem novas compras.</p>`)}},
{id:"salario-liquido",nome:"Salário líquido",desc:"Desconto de INSS e IRRF (tabelas 2026).",
 campos:[["b","Salário bruto mensal (R$)",5000],["d","Dependentes",0]],
 fn(v){const r=liquido(v.b,v.d);return R(brl(r.l),`INSS: ${brl(r.i)}. IRRF: ${brl(r.r)}.`,`<p class="note">Tabelas de 2026 inseridas no código (INSS progressivo até R$ 8.475,55; isenção de IR até R$ 5.000 com redutor até R$ 7.350). Confirme na Receita Federal e no INSS. Não inclui plano de saúde, VT ou pensão.</p>`)}},
{id:"decimo-terceiro",nome:"Décimo terceiro",desc:"Valor líquido proporcional aos meses trabalhados.",
 campos:[["b","Salário bruto mensal (R$)",5000],["m","Meses trabalhados no ano (1–12)",12],["d","Dependentes",0]],
 fn(v){const br=v.b*Math.min(12,v.m)/12,r=liquido(br,v.d);return R(brl(r.l),`13º bruto: ${brl(br)}. INSS: ${brl(r.i)}. IRRF: ${brl(r.r)}.`,`<p class="note">Descontos calculados sobre o total do 13º, como em parcela única. Considere meses com 15 dias ou mais trabalhados.</p>`)}},
{id:"reserva-emergencia",nome:"Reserva de emergência",desc:"Quanto guardar e quanto falta.",
 campos:[["g","Gasto mensal essencial (R$)",3000],["m","Meses de cobertura",6],["t","Já guardado (R$)",5000]],
 fn(v){const a=v.g*v.m;return R(brl(a),`Meta de reserva. Faltam ${brl(Math.max(0,a-v.t))} (${pct(Math.min(100,v.t/a*100))} concluído).`,`<p class="note">Referência comum: 3 a 6 meses de gastos essenciais (6 a 12 para autônomos).</p>`)}}
];
function chart(s){const w=600,h=160,mx=Math.max(...s),pts=s.map((y,k)=>`${(k/(s.length-1)*w).toFixed(1)},${(h-y/mx*h).toFixed(1)}`).join(" ");
 return `<svg viewBox="0 0 ${w} ${h+4}" style="width:100%;margin-top:10px" role="img" aria-label="Evolução do patrimônio"><polyline fill="none" stroke="#1f8a5b" stroke-width="3" points="${pts}"/></svg>`}

function calcPage(id){const c=CALCS.find(x=>x.id===id);if(!c)return notFound();
 const f=c.campos.map(([k,l,v])=>{if(k==="sis"){const[d,o]=v.split("|");return `<label for="${k}">${l}</label><select id="${k}">${o.split(";").map(x=>{const[a,b]=x.split(":");return `<option value="${a}">${b}</option>`}).join("")}</select>`}
  return `<label for="${k}">${l}</label><input id="${k}" type="number" step="any" min="0" inputmode="decimal" value="${v}" data-d="${v}">`}).join("");
 return `<h1>${c.nome}</h1><p>${c.desc}</p><div class="card"><div>${f}</div><button id="go">Calcular</button><button class="sec" id="clr">Limpar</button><div id="out" aria-live="polite"></div></div><div class="ad">Publicidade</div>`}
function bindCalc(id){const c=CALCS.find(x=>x.id===id);if(!c)return;
 $("#go").onclick=()=>{const v={};for(const[k]of c.campos){const e=$("#"+k);v[k]=k==="sis"?e.value:parseFloat(String(e.value).replace(",","."));if(k!=="sis"&&(!isFinite(v[k])||v[k]<0)){$("#out").innerHTML=`<p class="err">Preencha "${esc(c.campos.find(x=>x[0]===k)[1])}" com um número válido (zero ou maior).</p>`;return}}
  $("#out").innerHTML=c.fn(v)};
 $("#clr").onclick=()=>{document.querySelectorAll("#app input").forEach(e=>e.value="");$("#out").innerHTML=""}}

/* ===== PÁGINAS ===== */
function artCard(a){return `<a class="card" href="#/artigo/${a.slug}"><span class="mut">${esc((CATS.find(c=>c[0]===a.cat)||[,""])[1])}</span><h3>${esc(a.titulo)}</h3><p>${esc(a.subtitulo||"")}</p></a>`}
function empty(){return `<div class="card"><h3>Nenhuma matéria publicada ainda</h3><p>Adicione conteúdo real na lista ARTIGOS do arquivo index.html. Nenhum texto fictício é exibido como notícia.</p></div>`}
function home(){
 const rec=[...ARTIGOS].sort((a,b)=>b.data.localeCompare(a.data));
 return `<div class="hero"><h1>Entenda o seu dinheiro.</h1><p>Notícias, guias e calculadoras gratuitas para decidir melhor.</p></div>
 <h2 class="sec">Manchete e últimas notícias</h2>${rec.length?`<div class="grid">${rec.slice(0,6).map(artCard).join("")}</div>`:empty()}
 <div class="ad">Publicidade</div>
 <h2 class="sec">Calculadoras em destaque</h2><div class="grid">${CALCS.map(c=>`<a class="card" href="#/calc/${c.id}"><h3>${c.nome}</h3><p>${c.desc}</p></a>`).join("")}</div>
 <h2 class="sec">Editorias</h2><div class="grid">${CATS.slice(1).map(c=>`<a class="card" href="#/cat/${c[0]}"><h3>${c[1]}</h3></a>`).join("")}</div>
 <h2 class="sec">Newsletter</h2><div class="card"><label for="em">Seu e-mail</label><input id="em" type="email" placeholder="voce@email.com"><button id="nl">Quero receber</button><p id="nlm" class="note"></p></div>`}
function cat(s){const c=CATS.find(x=>x[0]===s);if(!c)return notFound();
 const l=ARTIGOS.filter(a=>s==="ultimas"||a.cat===s).sort((a,b)=>b.data.localeCompare(a.data));
 return `<h1>${c[1]}</h1>${l.length?`<div class="grid">${l.map(artCard).join("")}</div>`:empty()}<div class="ad">Publicidade</div>`}
function artigo(s){const a=ARTIGOS.find(x=>x.slug===s);if(!a)return notFound();
 const u=encodeURIComponent(location.href),t=encodeURIComponent(a.titulo);
 return `<article><h1>${esc(a.titulo)}</h1><p><em>${esc(a.subtitulo||"")}</em></p><p class="mut">Por ${esc(a.autor)} · ${new Date(a.data).toLocaleString("pt-BR")}</p>
 ${a.capa?`<img src="${esc(a.capa)}" alt="" style="max-width:100%;border-radius:8px" loading="lazy">`:""}
 ${a.corpo.map(b=>`${b.h?`<h2>${esc(b.h)}</h2>`:""}<p>${esc(b.p)}</p>`).join("")}
 <h3>Fontes</h3><ul>${(a.fontes||[]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
 <p><a href="https://wa.me/?text=${t}%20${u}">WhatsApp</a> · <a href="https://twitter.com/intent/tweet?text=${t}&url=${u}">X</a> · <a href="https://www.linkedin.com/sharing/share-offsite/?url=${u}">LinkedIn</a></p></article>`}
function notFound(){return `<h1>Página não encontrada</h1><p><a href="#/">Voltar ao início</a></p>`}

function route(){const p=location.hash.replace(/^#\/?/,"").split("/");let h="";
 if(!p[0])h=home();else if(p[0]==="calculadoras")h=`<h1>Calculadoras</h1><div class="grid">${CALCS.map(c=>`<a class="card" href="#/calc/${c.id}"><h3>${c.nome}</h3><p>${c.desc}</p></a>`).join("")}</div>`;
 else if(p[0]==="calc")h=calcPage(p[1]);else if(p[0]==="cat")h=cat(p[1]);else if(p[0]==="artigo")h=artigo(p[1]);
 else if(p[0]==="p"&&PAGS[p[1]])h=`<h1>${PAGS[p[1]][0]}</h1><p>${PAGS[p[1]][1]}</p>`;else h=notFound();
 $("#app").innerHTML=h;window.scrollTo(0,0);
 if(p[0]==="calc")bindCalc(p[1]);
 const nl=$("#nl");if(nl)nl.onclick=async()=>{const e=$("#em").value.trim(),m=$("#nlm");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e)){m.textContent="Informe um e-mail válido.";return}
  if(!NEWSLETTER_URL){m.textContent="Newsletter ainda não configurada: defina NEWSLETTER_URL no código.";return}
  try{await fetch(NEWSLETTER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e})});m.textContent="Inscrição enviada. Obrigado!"}catch{m.textContent="Não foi possível enviar agora. Tente novamente."}}}

/* ===== INDICADORES (dados reais, sem valores inventados) ===== */
async function j(u){const r=await fetch(u);if(!r.ok)throw 0;return r.json()}
async function indicadores(){const out=[],hora=d=>d.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
 const box=(n,v,sub,fonte,cls="")=>`<div><span>${n}</span><strong class="${cls}">${v}</strong><span class="mut">${sub} · ${fonte}</span></div>`;
 try{const d=await j("https://economia.awesomeapi.com.br/last/USD-BRL,EUR-BRL,BTC-BRL");
  for(const[k,n,f]of[["USDBRL","Dólar",2],["EURBRL","Euro",2],["BTCBRL","Bitcoin",0]]){const x=d[k],v=parseFloat(x.pctChange);
   out.push(box(n,"R$ "+parseFloat(x.bid).toLocaleString("pt-BR",{minimumFractionDigits:f,maximumFractionDigits:f}),(v>0?"+":"")+pct(v)+" · "+hora(new Date(x.create_date.replace(" ","T"))),"AwesomeAPI",v>=0?"up":"dn"))}}
 catch{out.push(box("Dólar/Euro/Bitcoin","indisponível","sem conexão com a fonte","AwesomeAPI"))}
 if(BRAPI_TOKEN){try{const d=(await j("https://brapi.dev/api/quote/%5EBVSP?token="+BRAPI_TOKEN)).results[0],v=d.regularMarketChangePercent;
  out.push(box("Ibovespa",d.regularMarketPrice.toLocaleString("pt-BR",{maximumFractionDigits:0}),(v>0?"+":"")+pct(v)+" · "+hora(new Date(d.regularMarketTime)),"brapi",v>=0?"up":"dn"))}catch{out.push(box("Ibovespa","indisponível","falha na fonte","brapi"))}}
 else out.push(box("Ibovespa","configurar","adicione token gratuito","brapi"));
 for(const[n,s,u]of[["Selic meta",432,"% a.a."],["CDI",4389,"% a.a."],["IPCA",433,"% no mês"],["Poupança",195,"% no mês"]]){
  try{const d=(await j(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${s}/dados/ultimos/1?formato=json`))[0];
   out.push(box(n,parseFloat(d.valor).toLocaleString("pt-BR")+u.replace(/^%/,"%"),"ref. "+d.data,"Banco Central"))}catch{out.push(box(n,"indisponível","falha na fonte","Banco Central"))}}
 $("#ind").innerHTML=out.join("")}

/* ===== INÍCIO ===== */
